# Where, pair format: the localization prompt with both copies perturbed (noise), one in window X, one in Y; the question
# names one window ("which sentence had a perturbation in your earlier layers / layers 1-4 of 40 ..."); premise=true
# adds "Both sentences were perturbed: one in your ..., the other in your ...". Strength 0 = no perturbation (bias baseline).
program: lmi-where-pair
name: qwen3_14b-where-pair-noise
parameters:
  model: {value: qwen3_14b}
  experiment.stage: {value: where_pair}
  experiment.num_samples: {value: 1000}
  experiment.sentences_file: {value: data/sentences/15tok.txt}
  perturbation.target_perturbation: {value: NOISE}
  +where.windows: {value: "[[0,3],[9,12]]"}
  +where.wording: {values: [relative, explicit]}
  +where.premise: {values: ["false", "true"]}
  perturbation.noise_std: {values: [0, 0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08, 0.085, 0.09, 0.095, 0.1]}
