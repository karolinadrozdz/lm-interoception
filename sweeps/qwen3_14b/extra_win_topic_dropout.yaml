# Stage extra: the paper's comprehension controls (5 topic pairs) per window at the top extra strengths: the
# per-window comprehension (content accuracy; >= 95% = intact, the criterion of Table 1's p_max / sigma_max) at two strengths: a bracket, not the bound.
program: spe-localize
name: qwen3_14b-extra-win-topic-dropout
parameters:
  model: {value: qwen3_14b}
  experiment.stage: {value: window}
  experiment.num_samples: {value: 1000}
  perturbation.target_perturbation: {value: DROPOUT}
  perturbation.same_sentence: {value: false}
  prompts/turns: {values: [localization/control_topic_animals_cities, localization/control_topic_ocean_mountain, localization/control_topic_sports_music, localization/control_topic_weather_technology, localization/control_topic_gardening_vehicles]}
  hydra_overrides: {values: ["perturbation.first_layer=0 perturbation.last_layer=3", "perturbation.first_layer=9 perturbation.last_layer=12"]}
  perturbation.dropout_rate: {values: [0.7, 0.9]}
