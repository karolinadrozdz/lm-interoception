# Where, single format: the zero-shot classification prompt; one sentence, noise in window X or Y (balanced). Options:
# EARLIER / LATER LAYERS (the earlier / later of two groups of your layers), LAYERS 1-4 / 10-13 OF 40, or the label
# controls X / Y and BRALTO / SIVEK (the paper's aliases). Strength 0 = no perturbation (bias baseline).
program: lmi-where-single
name: qwen3_14b-where-single-noise
parameters:
  model: {value: qwen3_14b}
  experiment.stage: {value: where_single}
  experiment.num_samples: {value: 1000}
  experiment.sentences_file: {value: data/sentences/15tok.txt}
  prompts/turns: {value: classification/main}
  perturbation.active_perturbations: {value: "[NOISE]"}
  perturbation.dropout_rate: {value: 0}
  +where.windows: {value: "[[0,3],[9,12]]"}
  +where.wording: {values: [relative, explicit, xy, nonsense]}
  perturbation.noise_std: {values: [0, 0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08, 0.085, 0.09, 0.095, 0.1]}
