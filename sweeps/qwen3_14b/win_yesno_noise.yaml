# "Was a perturbation applied?" (paper Sec. 5 detection) with the noise only in window X or Y: the paper's yesno_noise sweep
# with other layers (strength 0, the no-perturbation baseline, is in the anchor stage).
program: spe-classify
name: qwen3_14b-win-yesno-noise
parameters:
  model: {value: qwen3_14b}
  experiment.stage: {value: window}
  experiment.num_samples: {value: 1000}
  experiment.sentences_file: {value: data/sentences/15tok.txt}
  prompts/turns: {value: classification/perturbed}
  perturbation.active_perturbations: {value: "[NOISE]"}
  perturbation.dropout_rate: {value: 0}
  aliases: {value: noise_yes}
  hydra_overrides: {values: ["perturbation.first_layer=0 perturbation.last_layer=3", "perturbation.first_layer=9 perturbation.last_layer=12"]}
  perturbation.noise_std: {values: [0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08, 0.085, 0.09, 0.095, 0.1]}
